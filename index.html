      // Function to render section navigation
      function renderSectionNav() {
        sectionNav.innerHTML = "";

        foodSections.forEach((section) => {
          const button = document.createElement("button");
          button.className = "section-btn";
          button.textContent = `${section.icon} ${section.title}`;
          button.dataset.section = section.id;

          button.addEventListener("click", () => {
            // Remove active class from all buttons
            document.querySelectorAll(".section-btn").forEach((btn) => {
              btn.classList.remove("active");
            });

            // Add active class to clicked button
            button.classList.add("active");

            // Scroll to section
            const sectionElement = document.getElementById(section.id);
            if (sectionElement) {
              sectionElement.scrollIntoView({ behavior: "smooth" });
            }
          });

          sectionNav.appendChild(button);
        });

        // Set first section as active
        if (sectionNav.firstChild) {
          sectionNav.firstChild.classList.add("active");
        }
      }

      // Function to render all sections
      function renderSections(sections) {
        sectionsContainer.innerHTML = "";

        if (sections.length === 0) {
          noResults.style.display = "block";
          return;
        }

        noResults.style.display = "none";

        sections.forEach((section) => {
          const sectionElement = document.createElement("div");
          sectionElement.id = section.id;

          const sectionTitle = document.createElement("h2");
          sectionTitle.className = "section-title";
          sectionTitle.textContent = `${section.icon} ${section.title}`;

          const folderGrid = document.createElement("div");
          folderGrid.className = "folder-grid";

          section.items.forEach((item) => {
            const folderElement = document.createElement("div");
            folderElement.className = "folder";
            folderElement.innerHTML = `
                <div class="folder-img">${item.image}</div>
                <div class="folder-title">${item.title}</div>
            `;

            folderElement.addEventListener("click", () => {
              openModal(item);
            });

            folderGrid.appendChild(folderElement);
          });

          sectionElement.appendChild(sectionTitle);
          sectionElement.appendChild(folderGrid);
          sectionsContainer.appendChild(sectionElement);
        });
      }

      // Function to open modal with item details

            <h3><i class="fas fa-list"></i> Ingredients</h3>
            <ul class="ingredients-list">
                ${item.ingredients
                  .map((ingredient) => `<li>${ingredient}</li>`)
                  .join("")}
            </ul>
        `;

        }

        // Add steps section

            const stepElement = document.createElement("div");
            stepElement.className = "step";
            stepElement.innerHTML = `
                <h3 class="step-title">
                    <span class="step-number">${index + 1}</span>
                    ${step}
                </h3>
            `;
            modalBody.appendChild(stepElement);
          });
        }

        stepsModal.style.display = "block";
      }

      // Function to filter items based on search input
      function filterItems() {
        const searchTerm = searchInput.value.toLowerCase();

        if (searchTerm === "") {
          renderSections(foodSections);
          return;
        }

        const filteredSections = foodSections
          .map((section) => {
            const filteredItems = section.items.filter((item) => {
              return (
                item.title.toLowerCase().includes(searchTerm) ||
                (item.ingredients &&
                  item.ingredients.some((ingredient) =>
                    ingredient.toLowerCase().includes(searchTerm)
                  )) ||
                (item.steps &&
                  item.steps.some((step) =>
                    step.toLowerCase().includes(searchTerm)
                  ))
              );
            });

            return {
              ...section,
              items: filteredItems,
            };
          })
          .filter((section) => section.items.length > 0);

        renderSections(filteredSections);
      }

      // Event listeners
      searchInput.addEventListener("input", filterItems);

      closeModal.addEventListener("click", () => {
        stepsModal.style.display = "none";
      });

      window.addEventListener("click", (event) => {
        if (event.target === stepsModal) {
          stepsModal.style.display = "none";
        }
      });

      // Initial render
      renderSectionNav();
      renderSections(foodSections);
    </script>
  </body>
</html>
